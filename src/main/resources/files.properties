files.storage-dir=${java.io.tmpdir}/mockretest-files
files.max-size=5MB
# Container limits sit above files.max-size so the application-level check returns a clear 413.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
# Parse multipart bodies lazily (during @RequestParam resolution) so that a container-level size violation is raised
# once the handler is known and FilesExceptionHandler (scoped to the files package) can render it as problem+json.
spring.servlet.multipart.resolve-lazily=true
