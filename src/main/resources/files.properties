# Files feature settings (bound to FilesProperties). Only files.* keys belong here.
# Persistent default outside the OS temp dir (temp cleaners would delete stored bytes); override per environment.
files.storage-dir=./data/files
# Maximum accepted upload size. The app-level spring.servlet.multipart.* limits in application.properties must stay
# above this value; FilesConfig fails startup otherwise.
files.max-size=5MB
