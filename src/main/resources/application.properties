spring.application.name=mock-retest
spring.jpa.open-in-view=false

# --- App-level multipart limits (owned by the files feature, driven by files.max-size=5MB in files.properties) ---
# These apply to every multipart endpoint in the application. They sit above files.max-size so the files feature's
# own check runs and returns a clear 413; FilesConfig fails startup if they are lowered below files.max-size.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
# Parse multipart bodies lazily (during argument resolution) so container-level violations are raised once a handler
# is selected and can be rendered as problem+json by the owning feature's exception handler.
spring.servlet.multipart.resolve-lazily=true
